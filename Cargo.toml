[package]
name = "cyberstream"
version = "0.1.0"
license = "MIT"
edition = "2024"
build = "rust/build.rs"

[lib]
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.108"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = "0.38"
postcard = { version = "1.2.0", default-features = false, features = ["alloc"] }
lz4_flex = { version = "0.14.2", default-features = false, features = ["safe-encode", "safe-decode", "alloc"] }
js-sys = "=0.3.85"
wasm-bindgen-futures = "=0.4.58"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
maud = { version = "0.27.0", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
web-sys = { version = "=0.3.85", features = ["Document", "Element", "HtmlElement", "HtmlButtonElement", "Node", "Window", "Url", "UrlSearchParams"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
serde_json = "1"
