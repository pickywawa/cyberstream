name: Desktop release

# On every version tag: builds the desktop installers and attaches them to the GitHub release
# (created by `npm run release -- --publish`, or here if it does not exist yet).
#   macOS   dmg arm64 + x64, Developer ID signed and notarized when the Apple secrets exist
#   Windows NSIS installer + portable exe (not signed)
#   Linux   AppImage + deb
# Secrets (see scripts/RELEASE-SIGNING.md): MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD,
# APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME != package.json $PKG"; exit 1; fi
      - uses: ./.github/actions/setup
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  desktop:
    name: Build (${{ matrix.name }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, flag: --mac }
          - { name: Windows, os: windows-latest, flag: --win }
          - { name: Linux, os: ubuntu-latest, flag: --linux }
    env:
      HAS_APPLE_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Import the Developer ID certificate (macOS)
        if: ${{ matrix.name == 'macOS' && env.HAS_APPLE_SIGNING == 'true' }}
        # a dedicated keychain set up here rather than by electron-builder (its import step fails on recent runners)
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/cyberstream-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build
        run: node scripts/desktop-dist.mjs ${{ matrix.flag }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Remove the signing keychain
        if: ${{ always() && matrix.name == 'macOS' && env.HAS_APPLE_SIGNING == 'true' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/cyberstream-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.exe
            release/desktop/*.AppImage
            release/desktop/*.deb
          if-no-files-found: error

  publish:
    name: Attach to the GitHub release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          sha256sum * > SHA256SUMS-desktop.txt
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Cyberstream ${TAG#v}" --notes "Cyberstream ${TAG#v}"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *
